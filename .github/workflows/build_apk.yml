name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Create Flutter project structure
        run: |
          # Purane files ko bacha kar naya android/ios template generate kar rahe hain
          mkdir -p temp_code
          cp -r lib temp_code/
          cp pubspec.yaml temp_code/
          flutter create . --org com.cyberwall.app --project-name cyberwall --force
          rm -rf lib
          cp -r temp_code/lib .
          cp temp_code/pubspec.yaml .
          rm -rf temp_code

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberWall-APK
          path: build/app/outputs/flutter-apk/app-release.apk
